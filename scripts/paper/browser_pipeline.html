<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Edge-Sign browser pipeline</title>
<body><pre id="status">starting</pre><script type="module">
// Detector + recognizer in one page, each on its own execution provider.
// Driven by scripts/paper/runtime_matrix.py (pipeline subcommand). Frames are the
// server's 640x640 RGB uint8 test frames, fetched before timing starts (stands in for
// camera capture); canvas rendering and the tracker are not included.
const q = new URLSearchParams(location.search);
const run = q.get('run'), ortVersion = q.get('ort') || '1.30.0';
const det = {key: q.get('det'), ep: q.get('det_ep'), dtype: q.get('det_dtype') || 'float32'};
const rec = {key: q.get('rec'), ep: q.get('rec_ep'), dtype: q.get('rec_dtype') || 'float32'};
const frames = Number(q.get('frames') || 256), warmup = Number(q.get('warmup') || 20);
const threads = Number(q.get('threads') || 1), conf = Number(q.get('conf') || 0.25);
const status = document.querySelector('#status');
const result = {run, mode: 'pipeline', runtime: 'onnxruntime-web', ort_web_version: ortVersion, detector: det, recognizer: rec,
  frames, warmup, conf_threshold: conf, status: 'unsupported', user_agent: navigator.userAgent,
  cross_origin_isolated: crossOriginIsolated, requested_wasm_threads: threads};
const now = () => performance.now();
function summarize(xs) {
  const s = [...xs].sort((a, b) => a - b), mean = xs.reduce((a, b) => a + b, 0) / xs.length;
  const p = f => { const k = (s.length - 1) * f, lo = Math.floor(k), hi = Math.min(lo + 1, s.length - 1); return s[lo] + (s[hi] - s[lo]) * (k - lo); };
  return {n: xs.length, mean_ms: mean, p50_ms: p(.5), p90_ms: p(.9), p99_ms: p(.99), fps: 1000 / mean};
}
async function frameBytes(i) {
  const r = await fetch(`/frame?i=${i}&size=640`);
  if (!r.ok) throw new Error(`frame ${i}: HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}
function tensorOf(ort, f32, dtype, dims) {
  if (dtype === 'float16') return new ort.Tensor('float16', new Uint16Array(new Float16Array(f32).buffer), dims);
  return new ort.Tensor('float32', f32, dims);
}
function detInput(rgb) {
  const n = 640 * 640, f32 = new Float32Array(3 * n);
  for (let i = 0, j = 0; i < n; i++, j += 3) { f32[i] = rgb[j] / 255; f32[n + i] = rgb[j + 1] / 255; f32[2 * n + i] = rgb[j + 2] / 255; }
  return f32;
}
function decodeV4(data) {  // [300,6] xyxy/conf/class in 640 space, NMS-free
  const out = [];
  for (let k = 0; k < 300; k++) {
    const o = k * 6, c = data[o + 4];
    if (c >= conf && data[o + 2] > data[o] && data[o + 3] > data[o + 1]) out.push([data[o], data[o + 1], data[o + 2], data[o + 3], c, data[o + 5]]);
  }
  return out;
}
function cropBatch(rgb, boxes) {  // 8% margin as evaluate_recognition._crop, bilinear to 32x32, (x/255-0.5)/0.5
  const S = 32, n = S * S, f32 = new Float32Array(boxes.length * 3 * n);
  boxes.forEach(([x1, y1, x2, y2], b) => {
    const mx = Math.max(2, (x2 - x1) * 0.08), my = Math.max(2, (y2 - y1) * 0.08);
    const ax = Math.max(0, x1 - mx), ay = Math.max(0, y1 - my), bx = Math.min(639, x2 + mx), by = Math.min(639, y2 + my);
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
      const sx = ax + (xx + 0.5) * (bx - ax) / S - 0.5, sy = ay + (yy + 0.5) * (by - ay) / S - 0.5;
      const x0 = Math.max(0, Math.min(639, Math.floor(sx))), y0 = Math.max(0, Math.min(639, Math.floor(sy)));
      const x1b = Math.min(639, x0 + 1), y1b = Math.min(639, y0 + 1), fx = Math.min(1, Math.max(0, sx - x0)), fy = Math.min(1, Math.max(0, sy - y0));
      for (let ch = 0; ch < 3; ch++) {
        const v = (1 - fy) * ((1 - fx) * rgb[(y0 * 640 + x0) * 3 + ch] + fx * rgb[(y0 * 640 + x1b) * 3 + ch])
                + fy * ((1 - fx) * rgb[(y1b * 640 + x0) * 3 + ch] + fx * rgb[(y1b * 640 + x1b) * 3 + ch]);
        f32[b * 3 * n + ch * n + yy * S + xx] = (v / 255 - 0.5) / 0.5;
      }
    }
  });
  return f32;
}
async function main() {
  if (det.ep === 'webgpu' || rec.ep === 'webgpu') {
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) throw new Error('WebGPU adapter unavailable');
    const i = adapter.info || {};
    result.adapter = {vendor: i.vendor, architecture: i.architecture, device: i.device, description: i.description, shader_f16: adapter.features.has('shader-f16')};
  }
  const mod = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortVersion}/dist/ort.webgpu.bundle.min.mjs`);
  const ort = mod.default ?? mod;
  ort.env.wasm.numThreads = threads; ort.env.logLevel = 'warning';
  result.effective_wasm_threads = ort.env.wasm.numThreads;
  const load = async (m) => {
    const r = await fetch(`/model?key=${encodeURIComponent(m.key)}`);
    if (!r.ok) throw new Error(`model ${m.key}: HTTP ${r.status}`);
    const bytes = new Uint8Array(await r.arrayBuffer());
    const t0 = now();
    const s = await ort.InferenceSession.create(bytes, {executionProviders: [m.ep], graphOptimizationLevel: 'all'});
    m.bytes = bytes.length; m.sha256 = r.headers.get('X-Model-SHA256'); m.session_init_ms = now() - t0;
    return s;
  };
  status.textContent = 'loading models';
  const ds = await load(det), rs = await load(rec);
  const available = (await (await fetch('/info')).json()).frames;
  const trace = [];
  for (let i = 0; i < warmup + frames; i++) {
    const rgb = await frameBytes(i % available);
    const t0 = now();
    const dt = tensorOf(ort, detInput(rgb), det.dtype, [1, 3, 640, 640]);
    const t1 = now();
    const dout = await ds.run({[ds.inputNames[0]]: dt});
    const raw = dout[ds.outputNames[0]].data;
    const data = raw instanceof Float32Array ? raw : new Float32Array(new Float16Array(raw.buffer, raw.byteOffset, raw.length));
    const t2 = now();
    const boxes = decodeV4(data);
    const t3 = now();
    let t4 = t3, t5 = t3;
    if (boxes.length) {
      const rt = tensorOf(ort, cropBatch(rgb, boxes), rec.dtype, [boxes.length, 3, 32, 32]);
      t4 = now();
      const rout = await rs.run({[rs.inputNames[0]]: rt});
      const logits = rout[rs.outputNames[0]].data;
      if (logits.length !== boxes.length * 14) throw new Error('recognizer output size');
      t5 = now();
    }
    if (i >= warmup) trace.push({frame: i % available, detections: boxes.length, det_prepare_ms: t1 - t0, det_ms: t2 - t1,
      decode_ms: t3 - t2, rec_prepare_ms: t4 - t3, rec_ms: t5 - t4, total_ms: t5 - t0});
    if (i % 32 === 0) status.textContent = `pipeline ${i}/${warmup + frames}`;
  }
  result.metrics = Object.fromEntries(['det_prepare_ms', 'det_ms', 'decode_ms', 'rec_prepare_ms', 'rec_ms', 'total_ms']
    .map(k => [k, summarize(trace.map(t => t[k]))]));
  result.mean_detections = trace.reduce((a, t) => a + t.detections, 0) / trace.length;
  result.trace = trace;
  result.status = 'completed';
}
try { await main(); } catch (error) { result.reason = String(error?.stack ?? error); }
status.textContent = JSON.stringify({status: result.status, reason: result.reason}, null, 2);
await fetch('/result', {method: 'POST', body: JSON.stringify(result)});
</script></body></html>
