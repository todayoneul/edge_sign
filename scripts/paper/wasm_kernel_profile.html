<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Edge-Sign WASM kernel profile</title>
<body><pre id="status">starting</pre><script type="module">
// Driven by scripts/paper/wasm_kernel_profile.mjs over the Chrome DevTools Protocol. Same ORT-Web bundle,
// input and session options as runtime_matrix.html (speed mode); the page only warms up and then waits, so the
// driver can start the V8 CPU profiler around window.profileRun(n) alone.
const q = new URLSearchParams(location.search);
const model = q.get('model'), ortVersion = q.get('ort') || '1.30.0';
const warmup = Number(q.get('warmup') || 20), threads = Number(q.get('threads') || 1), size = 640;
const status = document.querySelector('#status');
const now = () => performance.now();
window.profileState = {status: 'loading', model, ort_web_version: ortVersion, requested_wasm_threads: threads,
                       warmup, user_agent: navigator.userAgent, cross_origin_isolated: crossOriginIsolated};
function makeTensor(ort, rgb) {
  const n = size * size, f32 = new Float32Array(3 * n);
  for (let i = 0, j = 0; i < n; i++, j += 3) { f32[i] = rgb[j] / 255; f32[n + i] = rgb[j + 1] / 255; f32[2 * n + i] = rgb[j + 2] / 255; }
  return new ort.Tensor('float32', f32, [1, 3, size, size]);
}
async function main() {
  const mod = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortVersion}/dist/ort.webgpu.bundle.min.mjs`);
  const ort = mod.default ?? mod;
  ort.env.wasm.numThreads = threads;
  ort.env.logLevel = 'warning';
  const r = await fetch(`/model?key=${encodeURIComponent(model)}`);
  if (!r.ok) throw new Error(`model HTTP ${r.status}`);
  const bytes = new Uint8Array(await r.arrayBuffer());
  window.profileState.model_sha256 = r.headers.get('X-Model-SHA256');
  const session = await ort.InferenceSession.create(bytes, {executionProviders: ['wasm'], graphOptimizationLevel: 'all'});
  window.profileState.effective_wasm_threads = ort.env.wasm.numThreads;
  const input = session.inputNames[0], output = session.outputNames[0];
  const rgb = new Uint8Array(await (await fetch(`/frame?i=0&size=${size}`)).arrayBuffer());
  const runOnce = async () => {
    const tensor = makeTensor(ort, rgb), a = now();
    const out = await session.run({[input]: tensor});
    if (out[output].data.length === 0) throw new Error('empty output');
    return now() - a;
  };
  for (let i = 0; i < warmup; i++) await runOnce();
  // the .wasm the bundle actually fetched (expected: ort-wasm-simd-threaded.asyncify.wasm)
  window.profileState.wasm_resources = performance.getEntriesByType('resource').map(e => e.name).filter(n => n.endsWith('.wasm'));
  window.profileRun = async n => {
    const times = [];
    for (let i = 0; i < n; i++) times.push(await runOnce());
    return times;
  };
  window.profileState.status = 'ready';
  status.textContent = 'ready';
}
main().catch(error => { window.profileState.status = 'error'; window.profileState.reason = String(error?.stack ?? error); });
</script></body></html>
