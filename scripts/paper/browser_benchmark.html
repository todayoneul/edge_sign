<!doctype html>
<html lang="en"><meta charset="utf-8"><title>TIIS ORT Web benchmark</title>
<body><pre id="status">Starting...</pre><script type="module">
const $ = new URLSearchParams(location.search);
const model = $.get('model') || 'fp32';
const ep = $.get('ep') || 'wasm';
const warmup = Number($.get('warmup') || 10);
const iterations = Number($.get('iterations') || 50);
const status = document.querySelector('#status');
const result = {status:'unsupported', model, ep, warmup_count:warmup,
  measured_iterations:iterations, ort_web_version:'1.22.0',
  user_agent:navigator.userAgent, hardware_concurrency:navigator.hardwareConcurrency,
  device_memory_gb:navigator.deviceMemory ?? null,
  cross_origin_isolated:crossOriginIsolated, headless:true, trace:[]};
const now = () => performance.now();
const mean = xs => xs.reduce((a,b)=>a+b,0)/xs.length;
const summarize = xs => {
  const sorted=[...xs].sort((a,b)=>a-b);
  const percentile=p=>{const index=(sorted.length-1)*p, lo=Math.floor(index), hi=Math.ceil(index);
    return sorted[lo]+(sorted[hi]-sorted[lo])*(index-lo)};
  const avg=mean(xs);
  return {mean_ms:avg,std_ms:Math.sqrt(mean(xs.map(x=>(x-avg)**2))),
    p50_ms:percentile(.5),p95_ms:percentile(.95),fps:1000/avg,n:xs.length};
};
const halfBuffer=new ArrayBuffer(4);
const halfFloat=new Float32Array(halfBuffer), halfBits=new Uint32Array(halfBuffer);
function float16Bits(value) {
  halfFloat[0]=value;
  const x=halfBits[0], sign=(x>>>16)&0x8000, exp=((x>>>23)&0xff)-127+15, mant=x&0x7fffff;
  if(exp<=0) return sign;
  if(exp>=31) return sign|0x7c00;
  return sign|(exp<<10)|(mant>>>13);
}
async function main() {
  if(!['wasm','webgpu'].includes(ep)) throw new Error('unknown execution provider');
  if(ep==='webgpu') {
    if(!navigator.gpu) throw new Error('navigator.gpu unavailable');
    const adapter=await navigator.gpu.requestAdapter();
    if(!adapter) throw new Error('WebGPU adapter unavailable');
    result.webgpu_adapter=adapter.info ? JSON.stringify(adapter.info) : 'info unavailable';
  }
  status.textContent='Loading ORT Web';
  const mod=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.bundle.min.mjs');
  const ort=mod.default ?? mod;
  if(ort.env?.wasm) ort.env.wasm.numThreads=1;
  result.wasm_threads=ort.env?.wasm?.numThreads ?? null;
  const frameStart=now();
  const frame=new Image(); frame.src='/frame.jpg'; await frame.decode();
  result.frame_load_ms=now()-frameStart;
  const canvas=document.createElement('canvas'); canvas.width=640;canvas.height=640;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  status.textContent='Downloading model';
  const dl=now();const response=await fetch(`/model?name=${encodeURIComponent(model)}`);
  if(!response.ok) throw new Error(`model fetch HTTP ${response.status}`);
  const bytes=new Uint8Array(await response.arrayBuffer());
  result.model_download_ms=now()-dl;result.model_size_bytes=bytes.length;
  result.model_sha256=response.headers.get('X-Model-SHA256');
  status.textContent='Initializing session';
  const init=now();
  const session=await ort.InferenceSession.create(bytes,{executionProviders:[ep],graphOptimizationLevel:'all'});
  result.session_init_ms=now()-init;
  const inputName=session.inputNames[0], outputName=session.outputNames[0];
  result.input_name=inputName;result.output_name=outputName;
  const isFp16=model==='fp16';
  function preprocess() {
    ctx.drawImage(frame,0,0,640,640);
    const rgba=ctx.getImageData(0,0,640,640).data;
    const n=640*640;
    const data=isFp16?new Uint16Array(3*n):new Float32Array(3*n);
    for(let i=0,j=0;i<n;i++,j+=4) {
      const r=rgba[j]/255,g=rgba[j+1]/255,b=rgba[j+2]/255;
      if(isFp16){data[i]=float16Bits(r);data[n+i]=float16Bits(g);data[2*n+i]=float16Bits(b)}
      else{data[i]=r;data[n+i]=g;data[2*n+i]=b}
    }
    return new ort.Tensor(isFp16?'float16':'float32',data,[1,3,640,640]);
  }
  async function once() {
    const t0=now(), tensor=preprocess(), t1=now();
    const outputs=await session.run({[inputName]:tensor}), t2=now();
    const data=outputs[outputName].data;
    if(data.length!==1800) throw new Error(`unsupported output size ${data.length}`);
    let count=0;for(let i=4;i<data.length;i+=6) if(data[i]>=.25)count++;
    const t3=now();
    return {preprocess_ms:t1-t0,inference_ms:t2-t1,postprocess_ms:t3-t2,
      detector_total_ms:t3-t0,detection_count:count};
  }
  const first=await once();result.first_inference_ms=first.inference_ms;
  for(let i=1;i<warmup;i++) await once();
  status.textContent='Measuring';
  for(let i=0;i<iterations;i++) result.trace.push({iteration:i,...await once()});
  result.metrics={};
  for(const key of ['preprocess_ms','inference_ms','postprocess_ms','detector_total_ms'])
    result.metrics[key]=summarize(result.trace.map(row=>row[key]));
  result.detection_count=result.trace.at(-1).detection_count;
  result.status='completed';
}
try { await main(); } catch(error) { result.reason=String(error?.stack ?? error); }
status.textContent=JSON.stringify({status:result.status,model,ep,reason:result.reason,
  fps:result.metrics?.detector_total_ms?.fps},null,2);
try {await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});}
catch(error){status.textContent+='\nRESULT POST FAILED: '+error;}
</script></body></html>
